name: hlekk-incident-release
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: maintainer
      POSTGRES_PASSWORD: local-fixture-owner
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - releases:/var/lib/postgresql
      - ./fixture.sql:/docker-entrypoint-initdb.d/fixture.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-d", "maintainer", "-U", "postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  releases:
